<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Example - Ness - Shirel</title>
  <style>
    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom, #003366, #0066cc, #99ccff);
      color: white;
      direction: rtl;
      text-align: right;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.2);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      max-width: 800px;
      width: 100%;
    }

    .logo img {
      width: 320px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
      color: #ffffff;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
    }

    input[type="text"], button {
      padding: 15px;
      font-size: 18px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: right;
    }

    input[type="text"] {
      background-color: rgba(255, 255, 255, 0.85);
      color: #003366;
      outline: none;
      transition: box-shadow 0.3s ease;
    }

    input[type="text"]:focus {
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.5);
    }

    button {
      background-color: #0066cc;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      background-color: #004c99;
      box-shadow: 0 4px 15px rgba(0, 102, 204, 0.6);
    }

    .answer {
      margin-top: 30px;
      font-size: 20px;
      color: #ffffff;
      text-shadow: 1px 1px 8px rgba(0, 0, 0, 0.4);
      animation: fadeIn 1s ease forwards;
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #ffffff;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .footer img {
      width: 40px;
      vertical-align: middle;
      margin-left: 10px;
    }

    .dropdown {
      position: absolute;
      top: 20px;
      left: 20px;
    }

    .dropdown select {
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      background-color: rgba(255, 255, 255, 0.8);
      color: #003366;
    }

    .formatted-answer {
      text-align: right;
      direction: rtl;
      line-height: 1.8;
      font-size: 18px;
      color: #ffffff;
      text-shadow: 1px 1px 8px rgba(0, 0, 0, 0.4);
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .formatted-answer strong {
      color: #ffcc33;
    }

    .formatted-answer a {
      color: #ffcc33;
      text-decoration: none;
    }

    .formatted-answer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="dropdown">
  <label for="source">מקור:</label>
  <select id="source">
    <option value="url">URL</option>
    <option value="file">File</option>
  </select>
</div>

<div class="container">
  <div class="logo">
    <img src="new-logo-medium.jpg" alt="לוגו בנק יהב">
  </div>
  <h1>שאל את שאלתך</h1>
  <input type="text" id="question" placeholder="הכנס את שאלתך כאן">
  <button onclick="askQuestion()">שאל</button>
  <div class="answer" id="answer"></div>
  <div class="footer">
    <img src="ness-logo.jpg" alt="לוגו Ness Technologies">
    פותח על ידי Ness Technologies
  </div>
</div>

<script>
  async function askQuestion() {
    const question = document.getElementById('question').value;
    const source = document.getElementById('source').value;

    const endpoint = source === 'url' ? '/openai/ask-from-url' : '/openai/ask-from-file';
    const body = source === 'url'
            ? JSON.stringify({ question, url: 'https://www.bank-yahav.co.il/' })
            : JSON.stringify({ question });

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
      });

      if (response.ok) {
        const data = await response.json();
        const formattedAnswer = formatAnswer(data.answer);
        document.getElementById('answer').innerHTML = formattedAnswer || 'לא התקבלה תשובה.';
      } else {
        document.getElementById('answer').innerHTML = 'אירעה שגיאה. נסה שוב מאוחר יותר.';
      }
    } catch (error) {
      console.error(error);
      document.getElementById('answer').innerHTML = 'אירעה שגיאה. נסה שוב מאוחר יותר.';
    }
  }

  function formatAnswer(answer) {
    let formattedAnswer = answer.replace(/\n/g, '<br>');
    formattedAnswer = formattedAnswer.replace(/(\d+\.)/g, '<strong>$1</strong>');
    formattedAnswer = formattedAnswer.replace(/\*\*/g, '').replace(/#/g, '');
    formattedAnswer = formattedAnswer.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(match, text, url) {
      return `<a href="${url}" target="_blank">${text}</a>`;
    });

    return `<div class="formatted-answer">${formattedAnswer}</div>`;
  }
</script>
</body>
</html>
