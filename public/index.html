<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Example - Ness - Shirel</title>
    <style>
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes spinText {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #003366, #0066cc, #99ccff);
            color: white;
            direction: rtl;
            text-align: right;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            max-width: 800px;
            width: 100%;
        }

        .logo img {
            width: 320px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 32px;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }

        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            width: 70%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.85);
            color: #003366;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            background-color: #0066cc;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        button:hover {
            background-color: #004c99;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.6);
        }

        .answer {
            margin-top: 30px;
            font-size: 20px;
            color: #ffffff;
            text-shadow: 1px 1px 8px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1s ease forwards;
        }

        .formatted-answer {
            text-align: right;
            direction: rtl;
            line-height: 1.8;
            font-size: 18px;
            color: #ffffff;
            text-shadow: 1px 1px 8px rgba(0, 0, 0, 0.4);
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .formatted-answer strong {
            color: #ffcc33;
        }

        .formatted-answer a {
            color: #ffcc33;
            text-decoration: none;
        }

        .formatted-answer a:hover {
            text-decoration: underline;
        }

        .loader {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }

        .circle-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }

        .circle-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            overflow: hidden;
        }

        .circle-text span {
            display: block;
            position: absolute;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
            background: linear-gradient(90deg, #003366, #0066cc, #99ccff, #003366);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 4s linear infinite, spinText 6s linear infinite;
        }

        .gcp-poc {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .note {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: -10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="new-logo-medium.jpg" alt="לוגו בנק יהב">
    </div>
    <h1>במה אוכל לסייע?</h1>
    <div class="input-container">
        <input type="text" id="question" placeholder="הכנס את שאלתך כאן">
        <button onclick="askQuestion()">שאל</button>
    </div>
    <p class="note">* נכתב בלשון זכר מטעמי נוחות בלבד, אך מיועד לנשים וגברים כאחד</p>
    <div class="answer" id="answer"></div>
</div>

<div class="loader" id="loader">
    <div class="circle-container">
        <div class="circle-text">
            <span>בנק יהב בשבילך</span>
        </div>
    </div>
</div>

<div class="gcp-poc">GCP-Gemini-1.5-Pro</div>

<script>
    // מאזין ללחיצה על אנטר בשדה השאלה
    document.getElementById('question').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            askQuestion();
        }
    });

    async function askQuestion() {
        const question = document.getElementById('question').value;
        const answerDiv = document.getElementById('answer');
        const loader = document.getElementById('loader');
        
        try {
            loader.style.display = 'block';
            answerDiv.innerHTML = '';
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 45000); // 45 second timeout

            const response = await fetch('/ido/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question }),
                signal: controller.signal
            });

            clearTimeout(timeoutId);

            const responseText = await response.text();
            
            // Check if the response starts with HTML tag
            if (responseText.trim().toLowerCase().startsWith('<!doctype html') || 
                responseText.trim().toLowerCase().startsWith('<html')) {
                throw new Error('קרתה תקלה, אנא נסה שנית');
            }

            // Parse the response as JSON
            let data;
            try {
                data = JSON.parse(responseText);
            } catch (e) {
                throw new Error('קרתה תקלה, אנא נסה שנית');
            }
            
            if (!response.ok || !data.answer) {
                throw new Error(data.error || 'קרתה תקלה, אנא נסה שנית');
            }

            const formattedAnswer = formatAnswer(data.answer);
            answerDiv.innerHTML = formattedAnswer;
            
        } catch (error) {
            console.error('Request error:', error);
            answerDiv.innerHTML = error.name === 'AbortError' 
                ? 'התשובה לקחה זמן רב מדי, אנא נסה שנית'
                : 'קרתה תקלה, אנא נסה שנית';
        } finally {
            loader.style.display = 'none';
        }
    }

    function formatAnswer(answer) {
        let formattedAnswer = answer.replace(/\n/g, '<br>');
        formattedAnswer = formattedAnswer.replace(/(\d+\.)/g, '<strong>$1</strong>');
        formattedAnswer = formattedAnswer.replace(/\*\*/g, '').replace(/#/g, '');
        formattedAnswer = formattedAnswer.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (match, text, url) {
            return `<a href="${url}" target="_blank">${text}</a>`;
        });

        return `<div class="formatted-answer">${formattedAnswer}</div>`;
    }
</script>
</body>
</html>
